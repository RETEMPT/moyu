name: Workflow regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install service test compiler
        run: npm install --no-save --ignore-scripts typescript@4.9.5
      - name: Verify workflows, PDF, source management and release rules
        run: node tools/verify-project.mjs
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
