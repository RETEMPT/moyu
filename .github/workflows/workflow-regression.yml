name: Workflow regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install service test compiler
        run: npm install --no-save --ignore-scripts typescript@4.9.5
      - name: Verify learning workflows, OCR, PDF, backups, persistence and AI
        run: node tools/verify-workflows.mjs
      - name: Verify app market gates and generated public materials
        run: |
          node tools/verify-app-market.mjs
          node tools/generate-market-materials.mjs --check
          node tools/generate-ui-icons.mjs --check
          node tools/app-market-preflight.mjs --project-only
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
